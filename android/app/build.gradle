plugins { id 'com.android.application' }

def keystorePath = System.getenv('RMS_ANDROID_KEYSTORE')
def keystorePassword = System.getenv('RMS_ANDROID_STORE_PASSWORD')
def keyAliasName = System.getenv('RMS_ANDROID_KEY_ALIAS') ?: 'responsive-mockup-studio'
def keyPasswordValue = System.getenv('RMS_ANDROID_KEY_PASSWORD') ?: keystorePassword
def releaseSigningReady = keystorePath && keystorePassword && keyPasswordValue && file(keystorePath).exists()

android {
    namespace 'co.ycswu.responsivemockupstudio'
    compileSdk 36

    defaultConfig {
        applicationId 'co.ycswu.responsivemockupstudio'
        minSdk 26
        targetSdk 36
        versionCode 13002
        versionName '1.3.2'
    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAliasName
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
            debuggable false
            if (releaseSigningReady) signingConfig signingConfigs.release
        }
    }

    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { resources.excludes += ['/META-INF/{AL2.0,LGPL2.1}'] }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
}
